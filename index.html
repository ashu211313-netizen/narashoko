<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2023–2025 Trajectory | 奈良商工高等学校</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;500&family=Playfair+Display:ital,wght@0,400;1,400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOADER ================= -->
<div id="loader">
  <div class="loader-content">
    <p class="loader-text">Nara Business & Technology</p>
    <div class="audio-warning">
      <p class="warning-txt">音が流れます。音量にご注意ください。</p>
      <div class="warning-line"></div>
    </div>
    <button id="start-btn">START</button>
  </div>
</div>

<audio id="bgm" loop>
  <source src="bgm.mp4" type="audio/mp4">
</audio>
<div id="audio-toggle">MUSIC: OFF</div>

<!-- ================= HERO ================= -->
<header class="hero">
  <div class="hero-content fade-in">
    <span class="sub-line">奈良商工高等学校</span>
    <h1 class="main-title">情報工学科</h1>
    <p class="years">2023 — 2025</p>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main>

  <!-- ===== 1st year ===== -->
  <section class="grade-section">
    <div class="grade-label fade-in">1st year</div>

    <section class="event">
      <div class="event-text fade-in"><h3>校外学習</h3></div>
      <div class="event-photos">
        <div class="img-wrapper left fade-in"><img src="1-1-1.jpg.jpg"></div>
        <div class="img-wrapper right fade-in"><img src="1-1-2.jpg.jpg"></div>
        <div class="img-wrapper center fade-in"><img src="1-1-3.jpg.JPG"></div>
        <div class="img-wrapper left fade-in"><img src="1-1-4.jpg.jpg"></div>
      </div>
    </section>

    <section class="event">
      <div class="event-text fade-in"><h3>体育祭</h3></div>
      <div class="event-photos">
        <div class="img-wrapper right fade-in"><img src="1-2-1.jpg.JPG"></div>
        <div class="img-wrapper left fade-in"><img src="1-2-2.jpg.JPG"></div>
      </div>
    </section>
  </section>

  <!-- ===== 2nd year ===== -->
  <section class="grade-section">
    <div class="grade-label fade-in">2nd year</div>

    <section class="event">
      <div class="event-text fade-in"><h3>修学旅行</h3></div>
      <div class="event-photos">
        <div class="img-wrapper left fade-in"><img src="2-4-1.jpg.JPG"></div>
        <div class="img-wrapper right fade-in"><img src="2-4-2.jpg.JPEG"></div>
        <div class="img-wrapper center fade-in"><img src="2-4-3.jpg.JPEG"></div>
      </div>
    </section>
  </section>

  <!-- ===== 3rd year ===== -->
  <section class="grade-section">
    <div class="grade-label fade-in">3rd year</div>

    <section class="event">
      <div class="event-text fade-in"><h3>体育祭</h3></div>
      <div class="event-photos">
        <div class="img-wrapper left fade-in"><img src="3-9-1.jpg.JPG"></div>
        <div class="img-wrapper right fade-in"><img src="3-9-2.jpg.JPG"></div>
        <div class="img-wrapper center fade-in"><img src="3-9-3.jpg.JPG"></div>
      </div>
    </section>
  </section>

</main>

<!-- ================= FOOTER ================= -->
<footer>
  <p class="footer-msg">Thank you for 3 wonderful years.</p>
  <p class="copyright">© 2026 情報工学科</p>
</footer>

<script src="main.js"></script>
</body>
</html>
