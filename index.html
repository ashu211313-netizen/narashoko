<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trajectory</title>

    <link rel="stylesheet" href="style.css?v=8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;500&family=Playfair+Display:ital,wght@0,400;1,400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Entrance : 通過儀礼 -->
    <div id="loader">
        <div class="loader-content">
            <p class="loader-text">Trajectory</p>

            <div class="audio-warning">
                <span class="audio-icon">🔊</span>
                <p class="warning-txt">音が流れます。</p>
            </div>

            <button id="start-btn">ENTER</button>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="bgm.mp4" type="audio/mp4">
    </audio>
    <div id="audio-toggle">MUSIC: OFF</div>

    <!-- Hero : 空気だけ -->
    <header class="hero">
        <div class="hero-content">
            <h1 class="main-title">Trajectory</h1>
        </div>
    </header>

    <main>

        <!-- layer : time 01 -->
        <section class="time-layer">
            <div class="time-mark">— 1st layer</div>

            <section class="event primary">
                <div class="event-photos">
                    <div class="img-wrapper center"><img src="1-1-3.jpg.JPG"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper left"><img src="1-1-1.jpg.jpg"></div>
                    <div class="img-wrapper right"><img src="1-1-2.jpg.jpg"></div>
                    <div class="img-wrapper left"><img src="1-1-4.jpg.jpg"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper right"><img src="1-2-1.jpg.JPG"></div>
                    <div class="img-wrapper left"><img src="1-2-2.jpg.JPG"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper center"><img src="1-3-1.jpg.JPG"></div>
                    <div class="img-wrapper right"><img src="1年文化祭.jpg"></div>
                </div>
            </section>
        </section>

        <!-- layer : time 02 -->
        <section class="time-layer">
            <div class="time-mark">— 2nd layer</div>

            <section class="event primary">
                <div class="event-photos">
                    <div class="img-wrapper center"><img src="2-4-3.jpg.JPEG"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper left"><img src="2-4-1.jpg.JPG"></div>
                    <div class="img-wrapper right"><img src="2-4-2.jpg.JPEG"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper right"><img src="2-5-1.jpg.jpg"></div>
                    <div class="img-wrapper left"><img src="2-5-2.jpg.jpg"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper center"><img src="2-6-1.jpg.JPG"></div>
                </div>
            </section>
        </section>

        <!-- layer : time 03 -->
        <section class="time-layer">
            <div class="time-mark">— 3rd layer</div>

            <section class="event primary">
                <div class="event-photos">
                    <div class="img-wrapper center"><img src="3-7-3.jpg.JPG"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper left"><img src="3-7-1.jpg.JPG"></div>
                    <div class="img-wrapper right"><img src="3-7-2.jpg.JPG"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper left"><img src="3-8-1.jpg.JPG"></div>
                    <div class="img-wrapper right"><img src="3-8-2.jpg.JPG"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper right"><img src="3-9-1.jpg.JPG"></div>
                    <div class="img-wrapper left"><img src="3-9-2.jpg.JPG"></div>
                    <div class="img-wrapper center"><img src="3-9-3.jpg.JPG"></div>
                    <div class="img-wrapper right"><img src="3-9-4.jpg.JPG"></div>
                </div>
            </section>

            <section class="event">
                <div class="event-photos">
                    <div class="img-wrapper left"><img src="3-10-1.jpg.JPG"></div>
                    <div class="img-wrapper right"><img src="3-10-2.jpg.JPG"></div>
                    <div class="img-wrapper left"><img src="3-10-3.jpg.JPG"></div>
                    <div class="img-wrapper right"><img src="3-10-4.jpg.JPG"></div>
                    <div class="img-wrapper center"><img src="3-10-5.jpg.JPG"></div>
                </div>
            </section>
        </section>

    </main>

    <!-- footer : open ended -->
    <footer>
        <p class="footnote">— still in motion</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
