<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trajectory | 2023-2025</title>
    <link rel="stylesheet" href="style.css?v=final">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div id="loader">
        <div class="loader-content">
            <p class="loader-text">Loading Time...</p>
            <button id="start-btn">ENTER</button>
        </div>
    </div>

    <audio id="bgm" loop><source src="bgm.mp4" type="audio/mp4"></audio>

    <header class="hero">
        <div class="hero-content">
            <p class="years italic fade-in-slow">2023 — 2025</p>
        </div>
    </header>

    <main>
        <section class="intro-section">
            <div class="intro-box fade-in">
                <span class="sub-line">奈良商工高等学校</span>
                <h2 class="main-title">情報工学科</h2>
            </div>
        </section>

        <div class="grade-section">
            <div class="grade-label">1st year</div>
            <section class="event">
                <div class="event-text fade-in"><h3>校外学習</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper left fade-in"><img src="1-1-1.jpg.jpg"></div>
                    <div class="img-wrapper center fade-in-special"><img src="1-1-3.jpg.JPG"></div> <div class="img-wrapper right fade-in"><img src="1-1-4.jpg.jpg"></div>
                </div>
            </section>
        </div>

        <div class="grade-section">
            <div class="grade-label">2nd year</div>
            <section class="event">
                <div class="event-text fade-in"><h3>修学旅行</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper center fade-in-special"><img src="2-4-1.jpg.JPG"></div>
                    <div class="img-wrapper left fade-in"><img src="2-4-2.jpg.JPEG"></div>
                </div>
            </section>
        </div>

        <div class="grade-section">
            <div class="grade-label">3rd year</div>
            <section class="event">
                <div class="event-text fade-in"><h3>文化祭</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper center fade-in-special"><img src="3-10-5.jpg.JPG"></div>
                    <div class="img-wrapper right fade-in"><img src="3-10-2.jpg.JPG"></div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="footer-minimal">
            <p class="italic">The trajectory continues.</p>
            <details class="dev-note">
                <summary>Archive Notes</summary>
                <div class="note-content">
                    <p>File naming grid: .jpg.jpg / .jpg.JPG / .jpg.JPEG</p>
                    <p>Built with NBT Information Technology philosophy.</p>
                </div>
            </details>
        </div>
    </footer>

    <div id="audio-toggle">MUSIC</div>
    <script src="main.js"></script>
</body>
</html>
