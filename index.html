<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2023-2025 Trajectory | 奈良商工高等学校</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;500&family=Playfair+Display:ital,wght@0,400;1,400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div id="loader">
        <div class="loader-content">
            <p class="loader-text">Nara Business & Technology</p>
            <div class="audio-warning">
                <span class="audio-icon">🔊</span>
                <p class="warning-txt">音が流れます。音量にご注意ください。</p>
            </div>
            <button id="start-btn">START</button>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="bgm.mp4" type="audio/mp4">
    </audio>
    <div id="audio-toggle">MUSIC: OFF</div>

    <header class="hero">
        <div class="hero-content fade-in">
            <span class="sub-line">奈良商工高等学校</span>
            <h1 class="main-title">情報工学科</h1>
            <p class="years italic">2023 — 2025</p>
        </div>
    </header>

    <main>
        <div class="grade-section">
            <div class="grade-label fade-in">1st year</div>
            <section class="event">
                <div class="event-text fade-in"><h3>校外学習</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper left fade-in"><img src="1-1-1.jpg"></div>
                    <div class="img-wrapper right fade-in"><img src="1-1-2.jpg"></div>
                    <div class="img-wrapper center fade-in"><img src="1-1-3.JPG"></div>
                    <div class="img-wrapper left fade-in"><img src="1-1-4.jpg"></div>
                </div>
            </section>
            <section class="event">
                <div class="event-text fade-in"><h3>体育祭 / 文化祭</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper right fade-in"><img src="1-2-1.JPG"></div>
                    <div class="img-wrapper left fade-in"><img src="1-2-2.JPG"></div>
                    <div class="img-wrapper center fade-in"><img src="1-3-1.JPG"></div>
                </div>
            </section>
        </div>

        <div class="grade-section">
            <div class="grade-label fade-in">2nd year</div>
            <section class="event">
                <div class="event-text fade-in"><h3>修学旅行</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper left fade-in"><img src="2-4-1.JPG"></div>
                    <div class="img-wrapper right fade-in"><img src="2-4-2.JPEG"></div>
                    <div class="img-wrapper center fade-in"><img src="2-4-3.JPEG"></div>
                </div>
            </section>
            <section class="event">
                <div class="event-text fade-in"><h3>体育祭 / 文化祭</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper right fade-in"><img src="2-5-1.jpg"></div>
                    <div class="img-wrapper left fade-in"><img src="2-5-2.jpg"></div>
                    <div class="img-wrapper center fade-in"><img src="2-6-1.JPG"></div>
                </div>
            </section>
        </div>

        <div class="grade-section">
            <div class="grade-label fade-in">3rd year</div>
            <section class="event">
                <div class="event-text fade-in"><h3>球技大会 / 校外学習</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper left fade-in"><img src="3-7-1.JPG"></div>
                    <div class="img-wrapper right fade-in"><img src="3-7-2.JPG"></div>
                    <div class="img-wrapper left fade-in"><img src="3-8-1.JPG"></div>
                </div>
            </section>
            <section class="event">
                <div class="event-text fade-in"><h3>体育祭 / 文化祭</h3></div>
                <div class="event-photos">
                    <div class="img-wrapper right fade-in"><img src="3-9-1.JPG"></div>
                    <div class="img-wrapper left fade-in"><img src="3-9-2.JPG"></div>
                    <div class="img-wrapper center fade-in"><img src="3-10-1.JPG"></div>
                    <div class="img-wrapper right fade-in"><img src="3-10-5.JPG"></div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p class="italic">Thank you for 3 wonderful years.</p>
        <p>© 2026 情報工学科</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
